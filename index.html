input[type=password]{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);margin-bottom:10px}
.dash{display:grid;grid-template-columns:1fr;gap:0 20px;align-items:start}

.pay{border:none;border-radius:8px;padding:5px 12px;background:color-mix(in srgb,var(--rd) 18%,var(--card));color:var(--rd)}.pay.y{background:color-mix(in srgb,var(--gr) 20%,var(--card));color:var(--gr)}
.pw{position:relative}.pw input{padding-right:48px}.eye{position:absolute;right:4px;top:3px;border:none;background:none;color:var(--mu);padding:9px;line-height:0}
</style>

<div id="lg"><div class="lgc"><div style="font-size:44px">📚</div><h2 style="margin:6px 0 14px">MimeMine</h2><div class="seg" id="lgt"><button class="cb on" id="t1" onclick="lgMode(1)">เข้าสู่ระบบ</button><button class="cb" id="t2" onclick="lgMode(2)">สมัครใช้งาน</button></div><select id="lgr" style="display:none"><option value="admin">แอดมิน</option><option value="sec">ฝ่ายเลขา</option><option value="tre">ฝ่ายเหรัญญิก</option></select><input id="lgn" type="text" placeholder="ชื่อที่อยากให้เรียก" maxlength="30" autocomplete="off" style="display:none"><input id="lgi" type="text" inputmode="numeric" placeholder="เลขประจำตัวนักเรียน" autocomplete="off"><div class="pw"><input id="lgp" type="password" placeholder="รหัสผ่าน" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" class="eye" onclick="eye()" aria-label="แสดงรหัส"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="btn p" style="width:100%" id="lgb" onclick="doLogin()">เข้าสู่ระบบ</button><p style="margin:16px 0 0;font-size:14px"><a href="#" id="lgf" onclick="lgMode(lgM===4?1:4);return false" style="color:var(--ac)">ลืมรหัสผ่าน?</a><br><a href="#" id="lga" onclick="lgMode(lgM===3?1:3);return false" style="color:var(--ac);display:inline-block;margin-top:8px">เข้าสู่ระบบเจ้าหน้าที่</a></p></div></div>

<script>
var S={tasks:[],subjects:[],tt:[[],[],[],[],[],[],[]]},view="home",wk=0,flt="",form={type:"task",subj:""},ttDay=0;
var DAYS=["จันทร์","อังคาร","พุธ","พฤหัสฯ","ศุกร์","เสาร์","อาทิตย์"];
var HUES=[225,265,335,15,38,150,175,290,355,95];
try{var r=localStorage.getItem("hw2");if(r)S=JSON.parse(r);else{var o=localStorage.getItem("hw");if(o)S.tasks=JSON.parse(o)}}catch(e){}
var ADMIN="3968270465",KEY=null,ROLE="",SMIN=39677,SMAX=39706;
function sess(){try{return localStorage.getItem("hwu")}catch(e){return null}}
function loadS(){S={tasks:[],subjects:[],tt:[[],[],[],[],[],[],[]]};try{var r=localStorage.getItem(KEY)||(ROLE==="stu"&&localStorage.getItem("hw2"));if(r)S=JSON.parse(r)}catch(e){}
  if(!S.tasks)S.tasks=[];if(!S.subjects)S.subjects=[];if(!S.tt||S.tt.length!==7)S.tt=[[],[],[],[],[],[],[]];
  S.tt=S.tt.map(function(l){return(l||[]).map(function(x){return typeof x==="string"?{n:x}:x})});S.tasks.forEach(function(t){addSubj(t.subj)})}
function login(id){ROLE=({admin:"admin",sec:"sec",tre:"tre"})[id]||"stu";KEY="hw2_"+id;loadS();if(ROLE==="admin"&&!S.ann)S.ann={chat:"",items:[]};if(ROLE==="sec"&&!S.hw)S.hw={items:[],ping:null};if(ROLE==="tre"&&!S.fee)S.fee={topics:[],paid:{},ping:null};pollAll();$("lg").style.display="none";$("lgp").value="";
  if(ROLE==="admin"){if(!S.tt.some(function(l){return l.length}))applyTT(PRE)}else if(ROLE==="stu"){var pd=takePend();if(pd){applyTT(pd);S.dflt=1;S.dver="link";toast("ใส่ตารางเรียนจากลิงก์แล้ว 🎉")}else if(!S.dflt)pullDef(1)};
  save();view="home";render();notify(false)}
var lgM=1;
function lgMode(m){lgM=m;var st=m===3;$("t1").className="cb"+(m===1?" on":"");$("t2").className="cb"+(m===2?" on":"");$("lgt").style.display=st||m===4?"none":"";$("lgn").style.display=m===2||m===4?"":"none";$("lgn").placeholder=m===4?"รหัสรีเซ็ตจากแอดมิน":"ชื่อที่อยากให้เรียก";$("lgi").style.display=st?"none":"";$("lgr").style.display=st?"":"none";$("lgp").placeholder=st?"รหัสเจ้าหน้าที่":m===4?"รหัสผ่านใหม่":"รหัสผ่าน";$("lgb").textContent=["","เข้าสู่ระบบ","สมัครและเข้าใช้งาน","เข้าสู่ระบบเจ้าหน้าที่","ตั้งรหัสผ่านใหม่"][m];$("lga").textContent=st?"← กลับ":"เข้าสู่ระบบเจ้าหน้าที่";$("lgf").textContent=m===4?"← กลับ":"ลืมรหัสผ่าน?";$("lgp").value=""}
function accs(){try{return JSON.parse(localStorage.getItem("hwacc"))||{}}catch(e){return{}}}
function uname(){return ({admin:"แอดมิน",sec:"ฝ่ายเลขา",tre:"ฝ่ายเหรัญญิก"})[ROLE]||(accs()[KEY.slice(4)]||{}).name||""}
function hp(p){var t="hw|"+p;if(window.crypto&&crypto.subtle)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")});var h=5381;for(var i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return Promise.resolve(""+h)}
function enter(v){try{localStorage.setItem("hwu",v)}catch(e){}login(v)}
function doLogin(){
  var p=$("lgp").value;
  if(lgM===3){var r=$("lgr").value;if(p===(r==="admin"?ADMIN:STAFF))login(r);else toast("รหัสไม่ถูกต้อง");return}
  var v=$("lgi").value.trim(),n=/^\d{5}$/.test(v)?+v:0,nm=$("lgn").value.trim();
  if(n<SMIN||n>SMAX){toast("เลขประจำตัวไม่ถูกต้อง");return}
  if(p.length<4){toast("รหัสผ่านอย่างน้อย 4 ตัว");return}
  var A=accs();
  if(lgM===4){if(nm!==rcode(v)){toast("รหัสรีเซ็ตไม่ถูกต้องหรือหมดอายุ");return}if(!A[v]){toast("เครื่องนี้ยังไม่ได้สมัคร ให้กดสมัครใช้งานแทน");return}hp(p).then(function(h){A[v].h=h;try{localStorage.setItem("hwacc",JSON.stringify(A))}catch(e){}enter(v)});return}
  if(lgM===2){if(!nm){toast("ใส่ชื่อก่อนนะ");return}if(A[v]){toast("เลขนี้สมัครแล้ว กดเข้าสู่ระบบ");return}
    hp(p).then(function(h){A[v]={name:nm,h:h};try{localStorage.setItem("hwacc",JSON.stringify(A))}catch(e){}enter(v)});return}
  if(!A[v]){toast("ยังไม่ได้สมัคร กดสมัครใช้งานก่อนนะ");return}
  hp(p).then(function(h){if(h!==A[v].h){toast("รหัสผ่านไม่ถูกต้อง");return}enter(v)})}
function logout(){try{localStorage.removeItem("hwu")}catch(e){}KEY=null;ROLE="";["lgn","lgi","lgp"].forEach(function(i){$(i).value=""});lgMode(1);$("lg").style.display="flex"}
function start(){var u=sess();if(u&&accs()[u])login(u)}
function pullDef(auto){fetch("timetable.json?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(!j||!Array.isArray(j.tt))throw 0;applyTT(j.tt);S.dflt=1;S.dver=j.ver||S.dver;save();render();toast(auto?"ใส่ตารางเรียนเริ่มต้นให้แล้ว 🎉":"อัปเดตตารางล่าสุดแล้ว")}).catch(function(){if(auto&&!S.tt.some(function(l){return l.length})){applyTT(PRE);save();render()}toast("โหลดตารางจากแอดมินไม่ได้ ใช้ตารางสำรองให้ก่อน")})}

var STAFF="esmt_0014!!",EXTRA={admin:[["adm","🛠","แอดมิน"]],sec:[["hw","📝","การบ้าน"]],tre:[["fee","💰","เก็บเงิน"]]},HW={items:[],ping:null},FEE={topics:[],paid:{},ping:null},SIDS=[];

function row(t,showSub){
  var b=isEx(t)?"":(t.done?'<button class="dn u" onclick="tog('+t.id+')">↩ ยกเลิก</button>':'<button class="dn" onclick="tog('+t.id+')">✓ ทำเสร็จ</button>');
  return'<div class="task'+(t.done?" done":"")+'" style="border-color:'+col(t.subj)+'"><div class="t">'+(showSub?"<b>"+esc(t.subj)+"</b> · ":"")+(isEx(t)?"🎓 สอบ ":"")+esc(t.title)+"</div>"+badge(t)+b+'<button class="x" onclick="del('+t.id+')" aria-label="ลบ">✕</button></div>';
}
function tog(id){S.tasks.forEach(function(t){if(t.id===id){t.done=!t.done;if(t.done)toast("เก่งมาก! เสร็จอีกอันแล้ว 🎉")}});save();render()}
function del(id){S.tasks=S.tasks.filter(function(t){return t.id!==id});save();render()}

function vHome(){
  var td=today(),pend=S.tasks.filter(function(t){return!isEx(t)&&!t.done});
  var urg=pend.filter(function(t){return t.due&&diff(t.due)<=1}).sort(sortT);
  var ex=S.tasks.filter(function(t){return isEx(t)&&diff(t.due)>=0&&diff(t.due)<=7}).sort(sortT);
  var dn=td.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long"});
  function cl(i){var l=ls(i);return l.length?l.map(function(x){return lesH(x)}).join(""):'<span class="mu">ไม่มีเรียน 🎉</span>'}
  var h='<div class="hero"><div class="top"><button onclick="askNotif()" aria-label="แจ้งเตือน">🔔</button><button onclick="go(\'set\')" aria-label="ตั้งค่า">⚙️</button><button onclick="logout()" aria-label="ออกจากระบบ">🚪</button></div><h2>สวัสดี '+esc(uname())+' 👋</h2><p>'+dn+'</p><div class="stats"><div class="stat"><b>'+pend.length+'</b><span>งานค้างทั้งหมด</span></div><div class="stat"><b>'+urg.length+'</b><span>ต้องรีบ</span></div><div class="stat"><b>'+ex.length+'</b><span>สอบใน 7 วัน</span></div></div></div>';
  h+='<div class="dash"><div>';
  h+='<h3 class="sec">⚠️ ต้องรีบทำ</h3>'+(urg.length||ex.length?'<div class="card">'+urg.map(function(t){return row(t,1)}).join("")+ex.map(function(t){return row(t,1)}).join("")+"</div>":'<div class="card empty">ไม่มีงานด่วน สบายใจได้ ✅</div>');
  h+=annH()+hwH()+feeH()+"</div><div>";
  h+='<h3 class="sec">📅 วันนี้เรียน</h3><div class="card"><div class="chips" style="margin:0">'+cl(dow(td))+'</div></div>';
  h+='<h3 class="sec">🌙 พรุ่งนี้เรียน</h3><div class="card"><div class="chips" style="margin:0">'+cl((dow(td)+1)%7)+"</div></div>";
  return h+"</div></div>";
}
function vTasks(){
  var h='<h3 class="sec" style="margin-top:4px">📖 งานแยกตามวิชา</h3><div class="chips"><button class="cb'+(flt?"":" on")+'" onclick="flt=\'\';render()">ทั้งหมด</button>'+S.subjects.map(function(s,i){return'<button class="cb'+(flt===s.n?" on":"")+'" onclick="setF('+i+')"><i style="background:'+col(s.n)+'"></i>'+esc(s.n)+"</button>"}).join("")+"</div>";
  var subs=S.subjects.filter(function(s){return!flt||s.n===flt}),any=false;
  h+='<div class="mas">';subs.forEach(function(s){
    var l=S.tasks.filter(function(t){return t.subj===s.n}).sort(sortT);if(!l.length)return;any=true;
    var left=l.filter(function(t){return!t.done&&!isEx(t)}).length;
    h+='<div class="card"><div class="sh3"><span class="dot" style="background:'+col(s.n)+'"></span><b>'+esc(s.n)+'</b><span class="badge">ค้าง '+left+"</span></div>"+l.map(function(t){return row(t,0)}).join("")+"</div>";
  });
  h+="</div>";if(!any)h+='<div class="empty">ยังไม่มีงาน กดปุ่ม + มุมขวาล่างเพื่อเพิ่ม</div>';
  return h;
}
function setF(i){flt=S.subjects[i].n;render()}
function vCal(){
  var t0=today(),mon=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-dow(t0)+wk*7),sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
  var h='<div class="weekbar"><button class="btn" onclick="wk--;render()">◀</button><b>'+mon.getDate()+"/"+(mon.getMonth()+1)+" – "+sun.getDate()+"/"+(sun.getMonth()+1)+'</b><span><button class="btn" onclick="wk=0;render()">สัปดาห์นี้</button> <button class="btn" onclick="wk++;render()">▶</button></span></div><div class="scroll"><div class="grid">';
  for(var i=0;i<7;i++){
    var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),k=fmt(d);
    var it=S.tasks.filter(function(t){return t.due===k}).sort(sortT);
    h+='<div class="day'+(k===fmt(t0)?" now":"")+'"><h4>'+DAYS[i]+" "+d.getDate()+"/"+(d.getMonth()+1)+"</h4>"+it.map(function(t){return'<div class="pc'+(t.done?" done":"")+'" style="border-color:'+col(t.subj)+'"><span><b>'+esc(t.subj)+"</b><br>"+(isEx(t)?"🎓 สอบ ":"")+esc(t.title)+"</span></div>"}).join("")+"</div>";
  }
  return h+"</div></div>";
}
function vTT(){
  var td=dow(today());if(ttSel<0)ttSel=td>4?0:td;
  var h='<h3 class="sec" style="margin-top:4px">🏫 ตารางเรียน</h3><div class="tabs">'+SH.map(function(n,i){return'<button class="tab'+(i===ttSel?" on":"")+(i===td?" now":"")+'" onclick="ttSel='+i+';render()">'+n+"</button>"}).join("")+'</div><div class="lbl" style="margin-bottom:8px">วัน'+DAYS[ttSel]+'</div>';
  var l=ls(ttSel);if(l.length)l.push({brk:1,s:3,e:1});l.sort(function(a,b){return(a.s||0)-(b.s||0)});
  h+=l.length?l.map(function(x){return lesH(x,ttSel)}).join(""):'<div class="card empty">วัน'+DAYS[ttSel]+'ยังไม่มีวิชา</div>';
  h+='<div class="chips" style="margin-top:12px"><button class="btn p" onclick="openCls('+ttSel+')">+ เพิ่มวิชา</button>'+(S.tt[ttSel].length?'<button class="btn" style="color:var(--rd)" onclick="askClr(\'day\','+ttSel+')">🗑 ล้างวันนี้</button>':"")+"</div>";
  return h;
}

function askClr(k,i){
  var m=k==="day"?"ล้างวิชาทั้งหมดของวัน"+DAYS[i]+" ใช่ไหม?":k==="tt"?"ล้างตารางเรียนทั้งหมด (ทุกวัน) ใช่ไหม? วิชาในรายการจะยังอยู่":"ล้างวิชาทั้งหมดและตารางเรียน ใช่ไหม? วิชาที่ยังมีงานหรือวันสอบอยู่จะถูกเก็บไว้ เพื่อไม่ให้งานหาย";
  sheet('<h3>ยืนยันการล้าง</h3><p>'+m+'</p><div class="chips"><button class="btn p" onclick="doClr(\''+k+'\','+i+')">ล้างเลย</button><button class="btn" onclick="closeS()">ยกเลิก</button></div>');
}
function doClr(k,i){
  var msg="ล้างแล้ว";
  if(k==="day")S.tt[i]=[];
  else if(k==="tt")S.tt=[[],[],[],[],[],[],[]];
  else{
    S.tt=[[],[],[],[],[],[],[]];var keep={};S.tasks.forEach(function(t){keep[t.subj]=1});
    var n=S.subjects.length;S.subjects=S.subjects.filter(function(x){return keep[x.n]});
    msg="ล้างวิชา "+(n-S.subjects.length)+" รายการ"+(S.subjects.length?" (เก็บ "+S.subjects.length+" วิชาที่ยังมีงาน)":"");
  }
  save();closeS();toast(msg);render();
}
function rmC(i,j){S.tt[i].splice(j,1);save();render()}
function vExam(){
  var ex=S.tasks.filter(isEx).sort(sortT),up=ex.filter(function(t){return diff(t.due)>=0}),pa=ex.filter(function(t){return diff(t.due)<0});
  var h='<h3 class="sec" style="margin-top:4px">🎓 ตารางสอบ</h3>';
  if(!ex.length)return h+'<div class="empty">ยังไม่มีวันสอบ กดปุ่ม + แล้วเลือก 🎓 สอบ</div>';
  if(up.length)h+='<div class="card">'+up.map(function(t){return'<div class="task" style="border-color:'+col(t.subj)+'"><div class="t"><b>'+esc(t.subj)+"</b> · "+esc(t.title)+'<br><span class="mu">'+DAYS[dow(parse(t.due))]+" "+dm(t.due)+"</span></div>"+badge(t)+'<button class="x" onclick="del('+t.id+')">✕</button></div>'}).join("")+"</div>";
  if(pa.length)h+='<h3 class="sec mu">สอบไปแล้ว</h3><div class="card">'+pa.map(function(t){return row(t,1)}).join("")+"</div>";
  return h;
}
function vSet(){
  var h='<h3 class="sec" style="margin-top:4px">⚙️ ตั้งค่า</h3><div class="card"><b>วิชาของฉัน</b> <div class="chips">'+S.subjects.map(function(s,i){return'<span class="cb"><i style="background:'+col(s.n)+'"></i>'+esc(s.n)+' <button class="x" style="padding:0 2px" onclick="rmS('+i+')">✕</button></span>'}).join("")+'</div><input id="nsub" type="text" placeholder="พิมพ์ชื่อวิชาใหม่" autocomplete="off"><button class="btn p" onclick="addS()">+ เพิ่มวิชา</button> <button class="btn" style="color:var(--rd)" onclick="askClr(\'sub\',0)">🗑 ล้างวิชาทั้งหมด</button></div>';
  h+='<div class="card"><b>👤 บัญชี</b><p class="mu">'+(ROLE!=="stu"?"โหมด"+uname():uname()+" · เลขประจำตัว "+KEY.slice(4))+'</p><div class="chips" style="margin:0">'+(ROLE!=="stu"?"":'<button class="btn" onclick="pullAsk()">🔄 ใช้ตารางล่าสุดจากแอดมิน</button>')+'<button class="btn" onclick="logout()">ออกจากระบบ</button></div></div>';
  h+='<div class="card"><b>🤝 แชร์ / นำเข้า</b><p class="mu">สร้างรหัสส่งให้เพื่อนทางแชต เพื่อนวางรหัสแล้วกดนำเข้า จะได้วิชา ตารางเรียน และตารางสอบเหมือนเรา (หรือวางรหัสตารางเรียนที่ได้จากแชต Claude)</p><div class="chips"><button class="btn" onclick="exp(0)">รหัส: ทั้งหมด</button><button class="btn" onclick="exp(1)">รหัส: ตารางเรียน</button><button class="btn" onclick="exp(2)">รหัส: ตารางสอบ</button></div><textarea id="code" placeholder="รหัสจะขึ้นที่นี่ หรือวางรหัสที่ได้รับ"></textarea><div class="chips" style="margin:0"><button class="btn" onclick="cp()">📋 คัดลอก</button><button class="btn p" onclick="imp()">⬇️ นำเข้า</button></div></div>';
  return h;
}
function addS(){var v=$("nsub").value;if(!v.trim())return;addSubj(v);save();render()}
function rmS(i){var n=S.subjects[i].n;if(S.tasks.some(function(t){return t.subj===n})){toast("ลบงานของวิชานี้ก่อนนะ");return}S.subjects.splice(i,1);S.tt=S.tt.map(function(l){return l.filter(function(x){return x.n!==n})});save();render()}
function exp(m){
  var it=S.tasks.filter(function(t){return m===2?isEx(t):m===0}).map(function(t){return{s:t.subj,t:t.title,d:t.due,y:t.type||"task"}});
  var o={v:2,sub:S.subjects.map(function(s){return s.n}),tt:m===2?[[],[],[],[],[],[],[]]:S.tt,items:m===1?[]:it};
  if(m===2)o.sub=[];
  $("code").value=btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function cp(){var c=$("code");if(!c.value){toast("ยังไม่มีรหัส");return}c.select();try{navigator.clipboard.writeText(c.value).then(function(){toast("คัดลอกแล้ว")},function(){document.execCommand("copy");toast("คัดลอกแล้ว")})}catch(e){try{document.execCommand("copy");toast("คัดลอกแล้ว")}catch(x){toast("กดค้างที่ช่องแล้วคัดลอกเอง")}}}
function imp(){
  var v=$("code").value.trim(),o,n=0;
  try{o=JSON.parse(decodeURIComponent(escape(atob(v))));if(Array.isArray(o))o={items:o}}catch(e){toast("รหัสไม่ถูกต้อง");return}
  (o.sub||[]).forEach(addSubj);
  if(Array.isArray(o.tt)&&o.tt.length===7)o.tt.forEach(function(l,i){if(Array.isArray(l)&&l.length)S.tt[i]=l.map(function(x){x=typeof x==="string"?{n:x}:x;x.n=addSubj(x.n);return x.n?x:null}).filter(Boolean)});
  (o.items||[]).forEach(function(x,i){
    if(!x||!x.s||!x.t)return;var y=x.y==="exam"?"exam":"task",s=addSubj(x.s);
    if(S.tasks.some(function(t){return t.subj===s&&t.title===x.t&&(t.due||"")===(x.d||"")&&(t.type||"task")===y}))return;
    S.tasks.push({id:Date.now()+i,subj:s,title:String(x.t).slice(0,200),due:/^\d{4}-\d\d-\d\d$/.test(x.d||"")?x.d:"",done:false,type:y});n++;
  });
  save();toast("นำเข้าสำเร็จ");$("code").value="";render();
}
/* sheets */
function sheet(h){$("sheet").innerHTML=h;$("ov").className="on"}
function closeS(){$("ov").className=""}
$("ov").onclick=function(e){if(e.target.id==="ov")closeS()};
function chipsHtml(fn){return S.subjects.map(function(s,i){return'<button class="cb'+(form.subj===s.n&&fn==="pick"?" on":"")+'" data-n="'+esc(s.n)+'" onclick="'+fn+'('+i+')"><i style="background:'+col(s.n)+'"></i>'+esc(s.n)+"</button>"}).join("")}
function openAdd(){
  form={type:"task",subj:""};
  sheet('<h3>เพิ่มรายการ</h3><div class="seg"><button class="cb on" id="ty1" onclick="setTy(\'task\')">📝 งาน</button><button class="cb" id="ty2" onclick="setTy(\'exam\')">🎓 สอบ</button></div><div class="lbl">แตะเลือกวิชา</div><div class="chips" id="pk">'+chipsHtml("pick")+'</div><input id="ns" type="text" placeholder="'+(S.subjects.length?"หรือพิมพ์วิชาใหม่":"พิมพ์ชื่อวิชา")+'" autocomplete="off"><input id="ti" type="text" placeholder="งานอะไร (เช่น ทำแบบฝึกหัดบทที่ 3)" autocomplete="off"><div class="lbl" id="dl">วันกำหนดส่ง</div><input id="du" type="date"><button class="btn p" style="width:100%" id="go" onclick="submitAdd()">เพิ่มงาน</button>');
}
function pick(i){form.subj=S.subjects[i].n;$("ns").value="";var b=$("pk").children;for(var k=0;k<b.length;k++)b[k].className="cb"+(b[k].getAttribute("data-n")===form.subj?" on":"")}
function setTy(x){form.type=x;$("ty1").className="cb"+(x==="task"?" on":"");$("ty2").className="cb"+(x==="exam"?" on":"");$("ti").placeholder=x==="exam"?"สอบเรื่องอะไร (เช่น บทที่ 1-3)":"งานอะไร (เช่น ทำแบบฝึกหัดบทที่ 3)";$("dl").textContent=x==="exam"?"วันสอบ":"วันกำหนดส่ง";$("go").textContent=x==="exam"?"เพิ่มวันสอบ":"เพิ่มงาน"}
function submitAdd(){
  var s=$("ns").value.trim()||form.subj,t=$("ti").value.trim(),d=$("du").value;
  if(!s){toast("เลือกหรือพิมพ์วิชาก่อนนะ");return}
  if(!t){toast("ใส่รายละเอียดงานก่อนนะ");return}
  if(form.type==="exam"&&!d){toast("เลือกวันสอบด้วยนะ");return}
  s=addSubj(s);S.tasks.push({id:Date.now(),subj:s,title:t,due:d,done:false,type:form.type});save();closeS();
  toast(form.type==="exam"?"เพิ่มวันสอบแล้ว 🎓":"เพิ่มงานแล้ว ✅");render();
}
function openCls(d){
  ttDay=d;var o=PT.slice(0,10).map(function(t,k){return'<option value="'+k+'">คาบ '+(k+1)+" · "+t+"</option>"}).join("");
  sheet('<h3>เพิ่มวิชาวัน'+DAYS[d]+'</h3><div class="lbl">แตะเลือกวิชา</div><div class="chips">'+chipsHtml("pickC")+'</div><input id="ns" type="text" placeholder="หรือพิมพ์วิชาใหม่" autocomplete="off"><div class="lbl">คาบเรียน</div><select id="pp">'+o+'</select><button class="btn p" style="width:100%" onclick="addC()">เพิ่มวิชานี้</button>');
}
function pickC(i){$("ns").value=S.subjects[i].n}
function addC(){var n=addSubj($("ns").value);if(!n){toast("เลือกหรือพิมพ์ชื่อวิชาก่อนนะ");return}S.tt[ttDay].push({n:n,s:+$("pp").value,e:1});save();closeS();render()}
$("fab").onclick=openAdd;
/* nav + render */
var NAV=[["home","🏠","หน้าแรก"],["tasks","📖","งาน"],["tt","🏫","ตารางเรียน"],["cal","🗓️","ปฏิทิน"],["exam","🎓","สอบ"]];
function go(v){view=v;render();$("main").scrollTop=0}
function render(){
  $("nav").innerHTML='<div class="logo">📚 MimeMine</div>'+NAV.concat(EXTRA[ROLE]||[]).map(function(n){return'<button class="'+(view===n[0]?"on":"")+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+"</span>"+n[2]+"</button>"}).join("")+'<div class="who"><b>'+esc(uname())+'</b><button onclick="logout()">🚪 ออกจากระบบ</button></div>';
  var f={hw:vHw,fee:vFee,adm:vAdm,home:vHome,tasks:vTasks,cal:vCal,tt:vTT,exam:vExam,set:vSet}[view];
  $("main").innerHTML=f();
}
function askNotif(){
  if(!("Notification" in window)){toast("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน");return}
  Notification.requestPermission().then(function(p){if(p==="granted"){notify(true);toast("เปิดแจ้งเตือนแล้ว")}else toast("ยังไม่ได้อนุญาตการแจ้งเตือน")});
}
function notify(force){if(!KEY)return;
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  var key="hwn"+fmt(today()),dn=false;try{dn=localStorage.getItem(key)}catch(e){}
  if(dn&&!force)return;
  var u=S.tasks.filter(function(t){return t.due&&(isEx(t)?(diff(t.due)>=0&&diff(t.due)<=3):(!t.done&&diff(t.due)<=1))});
  if(!u.length)return;
  new Notification("📚 มีเรื่องต้องรีบ "+u.length+" รายการ",{body:u.slice(0,4).map(function(t){return(isEx(t)?"สอบ ":"")+t.subj+": "+t.title}).join("\n")});
  try{localStorage.setItem(key,"1")}catch(e){}
}
start();
setInterval(function(){if(KEY&&ROLE==="stu")pollAll();if(KEY&&$("ov").className!=="on"&&view!=="set"&&view!=="adm"&&view!=="hw"&&view!=="fee")render();notify(false)},60000);
</script>
</body>
